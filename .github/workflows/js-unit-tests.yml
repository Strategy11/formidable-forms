name: JS unit tests

on:
  pull_request:
    types: [opened, labeled, synchronize]

concurrency:
  group: formidable-js-unit-tests-${{ github.ref }}-${{ ((contains(github.event.pull_request.labels.*.name, 'run analysis') || contains(github.event.pull_request.labels.*.name, 'full automated qa')) && (github.event.action != 'labeled' || github.event.label.name == 'run analysis' || github.event.label.name == 'full automated qa')) && 'active' || github.run_id }}
  cancel-in-progress: true

jobs:
  runJsUnitTests:
    if: >-
      (contains(github.event.pull_request.labels.*.name, 'run analysis') || contains(github.event.pull_request.labels.*.name, 'full automated qa'))
      && (github.event.action != 'labeled' || github.event.label.name == 'run analysis' || github.event.label.name == 'full automated qa')
    name: Run node --test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # The tests in tests/js only import Node built-ins and dependency-free
      # modules from js/src, so no npm install is needed.
      - name: Run JS unit tests
        run: node --test tests/js/*.test.mjs
