name: Oxlint

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, labeled, synchronize]

# Cancel superseded runs for the same branch. The group is named explicitly
# rather than derived from github.workflow: several files share the workflow
# name `Inspections` and would otherwise cancel each other.
concurrency:
  group: formidable-oxlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runOxlintInspection:
    if: contains(github.event.pull_request.labels.*.name, 'run analysis')
    name: Run Oxlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Remove package files for faster install
        run: rm -f package.json package-lock.json

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Oxlint
        run: npm install oxlint@1.59.0 --no-package-lock

      - name: Run Oxlint
        run: ./node_modules/.bin/oxlint . --format unix
