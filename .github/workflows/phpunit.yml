on:
  # Trigger the workflow on push or pull request,
  # but only for the main branch
  push:
    branches:
      - master
  pull_request:
    types: [ opened, labeled, synchronize ]

name: PHPUnit
# Cancel superseded runs for the same branch. The group is named explicitly
# rather than derived from github.workflow: several files share the workflow
# name `Inspections` and would otherwise cancel each other.
concurrency:
  group: formidable-phpunit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    if: contains(github.event.pull_request.labels.*.name, 'run tests')
    runs-on: ubuntu-latest
    env:
      WP_MULTISITE: ${{ matrix.multisite }}
    strategy:
      # Report every matrix leg's own result rather than the default fail-fast
      # cancelling the others as soon as one fails - same reasoning as cypress.yml's
      # `fail-fast: false`.
      fail-fast: false
      matrix:
        include:
          - php: 7.4
            wordpress: 6.9
            multisite: 0
          - php: 8.0
            wordpress: 6.9
            multisite: 0
          - php: 8.0
            wordpress: trunk
            multisite: 0

    name: PHP ${{ matrix.php }} tests in WP ${{ matrix.wordpress }}
    steps:
      - uses: actions/checkout@v3.5.0

      # get the PHP version
      - uses: shivammathur/setup-php@2.24.0
        with:
          php-version: ${{ matrix.php }}
          tools: phpunit-polyfills

      - name: Installing WordPress
        run: |
          export WP_DEVELOP_DIR=/tmp/wordpress/
          git clone --depth=1 --branch="${{ matrix.wordpress }}" git://develop.git.wordpress.org/ /tmp/wordpress
          cd ..
          cp -r "${GITHUB_REPOSITORY#*/}" "/tmp/wordpress/src/wp-content/plugins/formidable"
          cd /tmp/wordpress/
          pwd
          cp wp-tests-config-sample.php wp-tests-config.php
          sed -i "s/youremptytestdbnamehere/wordpress_tests/" wp-tests-config.php
          sed -i "s/yourusernamehere/root/" wp-tests-config.php
          sed -i "s/yourpasswordhere/root/" wp-tests-config.php

      # A release branch (e.g. 6.9) ships pre-built dist/minified assets under `src/`;
      # a raw `trunk` checkout doesn't, so it hits unrelated core code paths that
      # expect them to already exist (wp_maybe_inline_styles's dist stylesheet check,
      # wp-admin CSS minification for e.g. view-transitions.min.css). Build them the
      # same way core's own CI does (reusable-build-package.yml: npm ci && npm run
      # build), but with the `:dev` variant so the output lands in `src/` (Gruntfile's
      # WORKING_DIR under `--dev`) where WP_DEVELOP_DIR points, instead of the plain
      # build's separate `build/` package directory.
      - name: Build WP core assets (trunk only - release branches ship these pre-built)
        if: matrix.wordpress == 'trunk'
        timeout-minutes: 5
        run: |
          cd /tmp/wordpress
          npm ci
          npm run build:dev
      - name: Creating database
        run: |
          sudo /etc/init.d/mysql start
          mysql -u root -proot -e "CREATE DATABASE wordpress_tests;"
      - name: PhpUnit tests
        run: |
          cd "/tmp/wordpress/src/wp-content/plugins/formidable"
          pwd
          phpunit --coverage-clover=coverage.xml
      - name: Send code coverage report to Codecov.io
        uses: codecov/codecov-action@v2
        with:
          files: /tmp/wordpress/src/wp-content/plugins/formidable/coverage.xml
